name: Bug
description: Reportar un comportamiento incorrecto
title: "[Bug]: "
labels: ["bug"]

body:
  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: Explica el comportamiento observado.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Pasos para reproducir
      description: Incluye datos exclusivamente sintéticos.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true

  - type: dropdown
    id: security
    attributes:
      label: ¿Tiene impacto de seguridad o privacidad?
      options:
        - "No"
        - "Sí: no publicar detalles; seguir SECURITY.md"
    validations:
      required: true
